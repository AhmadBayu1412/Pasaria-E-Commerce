services:

  # ==========================
  # BACKEND API
  # ==========================
  - type: web
    name: pasaria-api
    runtime: node
    region: singapore
    plan: free

    buildCommand: cd backend && npm install && npm run build:prod

    startCommand: cd backend && npx prisma migrate deploy && node dist/app.js

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3001

      - key: TRUST_PROXY_COUNT
        value: 1

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: SESSION_SECRET
        sync: false

      - key: SESSION_COOKIE_NAME
        value: __pasaria_sid

      - key: SESSION_TTL
        value: 86400

      - key: CORS_ORIGIN
        value: https://pasaria-frontend.onrender.com

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: SUPABASE_STORAGE_BUCKET
        value: product-images


  # ==========================
  # FRONTEND NEXT.JS
  # ==========================
  - type: web
    name: pasaria-frontend
    runtime: node
    region: singapore
    plan: free

    buildCommand: cd frontend && npm install && npm run build

    startCommand: cd frontend && node .next/standalone/server.js

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: NEXT_PUBLIC_API_URL
        value: https://pasaria-api.onrender.com
